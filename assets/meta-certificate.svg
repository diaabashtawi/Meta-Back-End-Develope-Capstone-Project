<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Meta Back-End Developer Certificate</title>
  <desc id="desc">Certificate preview styling for the Meta Back-End Developer Certificate earned by Deya Bakheet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f5d97b"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f5d97b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="55" y="45" width="1090" height="610" rx="22" fill="#ffffff" filter="url(#shadow)"/>

  <rect x="110" y="100" width="980" height="42" rx="21" fill="#0b3954"/>
  <text x="600" y="131" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff" font-weight="700" letter-spacing="2">META</text>

  <text x="600" y="240" text-anchor="middle" font-size="32" font-family="Segoe UI, Arial, sans-serif" fill="#23395b" font-weight="700" letter-spacing="3">BACK-END DEVELOPER</text>
  <text x="600" y="285" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#23395b" font-weight="600" letter-spacing="2">CERTIFICATE</text>

  <line x1="300" y1="325" x2="900" y2="325" stroke="#d4af37" stroke-width="3"/>

  <text x="600" y="395" text-anchor="middle" font-size="54" font-family="Georgia, 'Times New Roman', serif" fill="#102a43" font-weight="700">Deya Bakheet</text>
  <text x="600" y="445" text-anchor="middle" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#44546a">Capstone Project Completion</text>

  <rect x="220" y="500" width="760" height="80" rx="16" fill="#edf5ff"/>
  <text x="600" y="548" text-anchor="middle" font-size="28" font-family="Segoe UI, Arial, sans-serif" fill="#1d3557" font-weight="700">COURSE COMPLETION</text>

  <g transform="translate(180,95)">
    <path d="M0 0 L70 0 L70 70 L35 95 L0 70 Z" fill="url(#gold)" opacity="0.9"/>
    <circle cx="35" cy="28" r="14" fill="#ffffff" opacity="0.9"/>
    <path d="M20 48 L35 36 L50 48" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <g transform="translate(950,95)">
    <path d="M0 0 L70 0 L70 70 L35 95 L0 70 Z" fill="url(#gold)" opacity="0.9"/>
    <circle cx="35" cy="28" r="14" fill="#ffffff" opacity="0.9"/>
    <path d="M20 48 L35 36 L50 48" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
